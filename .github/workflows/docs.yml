name: Docs
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/docs.yml"]
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths: ["site/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Every deployment pushes to gh-pages, so run them one at a time.
concurrency:
  group: gh-pages
  cancel-in-progress: false

env:
  PREVIEW_BASE: /nest-native-adapters/pr-preview/pr-${{ github.event.number }}
  # Fork pull requests get a read-only token: build them, but do not deploy.
  CAN_DEPLOY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - if: github.event.action != 'closed'
        uses: pnpm/action-setup@v4
      - if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      # The site is a standalone project, not a workspace package.
      - if: github.event.action != 'closed'
        run: pnpm install --ignore-workspace --frozen-lockfile
      - if: github.event.action != 'closed'
        run: pnpm run build
        env:
          DOCS_BASE: ${{ github.event_name == 'pull_request' && env.PREVIEW_BASE || '' }}

      # main: publish the site at the root of gh-pages, keeping PR previews.
      - if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site/dist
          branch: gh-pages
          clean-exclude: pr-preview/

      # Pull requests: publish to pr-preview/pr-<number>/ and comment the link;
      # remove the preview when the pull request closes.
      - if: github.event_name == 'pull_request' && env.CAN_DEPLOY == 'true'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
