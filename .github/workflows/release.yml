name: Release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run test:bun
      - run: pnpm run test:packed
      # The tag must name the version both packages carry.
      - run: node scripts/check-packages.mjs --release "${GITHUB_REF_NAME#v}"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: npm install --global npm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # pnpm rewrites catalog: and workspace: ranges to real versions when packing.
      - name: Pack and publish with npm OIDC
        run: |
          mkdir -p "$RUNNER_TEMP/release-packages"
          pnpm --filter nestjs-adapter-node --filter nestjs-adapter-bun pack --pack-destination "$RUNNER_TEMP/release-packages"
          version="${GITHUB_REF_NAME#v}"
          npm publish "$RUNNER_TEMP/release-packages/nestjs-adapter-node-$version.tgz" --access public --registry=https://registry.npmjs.org
          npm publish "$RUNNER_TEMP/release-packages/nestjs-adapter-bun-$version.tgz" --access public --registry=https://registry.npmjs.org
